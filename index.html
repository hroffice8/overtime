<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIU Attendance Review Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* --- WEB UI STYLES --- */
      body { 
        background-color: #f3f4f6; 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      }
      .sub-label { 
        display: block; 
        font-weight: normal; 
        color: #006a4e; 
        font-size: 13px; 
        margin-bottom: 4px; 
      }
      .checkmark-circle { 
        width: 100px; height: 100px; 
        background: #dcfce7; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin: 0 auto 20px; 
      }
      .checkmark { color: #16a34a; font-size: 50px; }

      /* --- A4 PRINT LAYOUT (ONE-PAGE OPTIMIZATION) --- */
      @media print {
        @page { 
          size: A4; 
          margin: 5mm !important; /* Forces narrow margins for A4 */
        }
        
        html, body { 
          background-color: white !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          -webkit-print-color-adjust: exact; 
          font-size: 10pt;
          /* Slightly scale down to ensure it fits one page */
          zoom: 0.95; 
        }
        
        /* Hide all non-essential web elements */
        #searchSection, #otpBtn, #printBtn, #termsCheckboxLabel, 
        #loader, .no-print, #instructionModal, #otpModal, button, 
        .animate-pulse, #supervisorInputSection, #termsCheckboxLabel {
          display: none !important;
        }
        
        /* Ensure Signatures are visible and positioned correctly */
        #printSignatures { 
          display: flex !important; 
          visibility: visible !important;
          margin-top: 30px !important; 
          justify-content: space-between !important;
          page-break-before: avoid;
        }

        .container, .max-w-4xl { 
          box-shadow: none !important; 
          max-width: 100% !important; 
          width: 100% !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          border: none !important;
          background-color: white !important;
        }
        
        /* Simplify background colors for printers */
        .bg-gray-50, .bg-blue-50, .bg-red-50, .bg-white { 
          background-color: white !important; 
          border: 1px solid #eee !important; 
        }
        
        /* Compact Table for Print */
        table { 
          font-size: 10px !important; 
          width: 100% !important; 
          border-collapse: collapse !important; 
          page-break-inside: avoid;
        }
        th, td { border: 1px solid #ddd !important; padding: 4px !important; }
        th { background-color: #f3f4f6 !important; color: black !important; }

        #mainTitle { 
          text-align: center !important; 
          color: #006a4e !important; 
          font-size: 20px !important; 
          margin-bottom: 10px !important; 
          border-bottom: 2px solid #006a4e !important; 
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 p-2 md:p-6">
    <div id="root"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
