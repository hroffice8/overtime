
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Review Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background-color: #f3f4f6; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      
      /* CUSTOM STYLES */
      .sub-label { display: block; font-weight: normal; color: #006a4e; font-size: 13px; margin-bottom: 4px; }
      .checkmark-circle { width: 100px; height: 100px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
      .checkmark { color: #16a34a; font-size: 50px; }
  
      /* =========================================
         PRINT STYLES (A4 Layout)
         ========================================= */
      @media print {
        @page { size: A4; margin: 15mm; }
        html, body { background-color: white !important; padding: 0 !important; margin: 0 !important; -webkit-print-color-adjust: exact; }
        
        #searchSection, #otpBtn, #printBtn, #termsCheckboxLabel, #loader, .no-print, #instructionModal, #otpModal, button {
          display: none !important;
        }
        
        #supervisorInputSection { display: none !important; }
        
        /* Force signature area visibility despite 'hidden' utility class */
        #printSignatures { 
          display: flex !important; 
          visibility: visible !important;
          margin-top: 60px !important; 
          justify-content: space-between !important;
        }
  
        .container { 
          box-shadow: none !important; 
          max-width: 100% !important; 
          width: 100% !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          border: none !important;
          background-color: white !important;
        }
        
        .bg-gray-50, .bg-blue-50, .bg-red-50, .bg-white { background-color: white !important; border: 1px solid #eee !important; }
        
        input { border: none !important; border-bottom: 1px solid #333 !important; padding: 0 !important; margin-top: 10px !important; font-weight: bold !important; }
        
        table { font-size: 11px !important; width: 100% !important; border-collapse: collapse !important; }
        th, td { border: 1px solid #ddd !important; padding: 6px !important; }
        th { background-color: #eee !important; color: black !important; }

        #mainTitle { text-align: center !important; color: black !important; font-size: 24px !important; margin-bottom: 20px !important; border-bottom: 2px solid black !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-100 p-2 md:p-6">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
