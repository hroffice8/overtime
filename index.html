<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIU Attendance Review Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* --- WEB UI STYLES --- */
      body { 
        background-color: #f3f4f6; 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      }
      .sub-label { 
        display: block; 
        font-weight: normal; 
        color: #006a4e; 
        font-size: 13px; 
        margin-bottom: 4px; 
      }
      .checkmark-circle { 
        width: 100px; height: 100px; 
        background: #dcfce7; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin: 0 auto 20px; 
      }
      .checkmark { color: #16a34a; font-size: 50px; }

      /* --- A4 PRINT LAYOUT (NARROW) --- */
      @media print {
        @page { 
          size: A4; 
          margin: 5mm; /* Forced Narrow Margins */
        }
        
        html, body { 
          background-color: white !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          -webkit-print-color-adjust: exact; 
          font-size: 10pt;
        }
        
        /* Hide non-essential UI elements */
        #searchSection, #otpBtn, #printBtn, #termsCheckboxLabel, 
        #loader, .no-print, #instructionModal, #otpModal, button, 
        .animate-pulse, #supervisorInputSection {
          display: none !important;
        }
        
        /* Force Signature Area Visibility */
        #printSignatures { 
          display: flex !important; 
          visibility: visible !important;
          margin-top: 40px !important; 
          justify-content: space-between !important;
        }

        .container, .max-w-4xl { 
          box-shadow: none !important; 
          max-width: 100% !important; 
          width: 100% !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          border: none !important;
        }
        
        .bg-gray-50, .bg-blue-50, .bg-red-50, .bg-white { 
          background-color: white !important; 
          border: 1px solid #eee !important; 
        }
        
        /* Table Styling for Print */
        table { 
          font-size: 11px !important; 
          width: 100% !important; 
          border-collapse: collapse !important; 
          page-break-inside: avoid;
        }
        th, td { border: 1px solid #ddd !important; padding: 6px !important; }
        th { background-color: #eee !important; color: black !important; }

        #mainTitle { 
          text-align: center !important; 
          color: black !important; 
          font-size: 22px !important; 
          margin-bottom: 15px !important; 
          border-bottom: 2px solid black !important; 
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 p-2 md:p-6">
    <div id="root"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
