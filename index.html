<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIU Attendance Review Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* --- WEB UI STYLES --- */
      body { 
        background-color: #f3f4f6; 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      }
      .sub-label { 
        display: block; 
        font-weight: normal; 
        color: #006a4e; 
        font-size: 13px; 
        margin-bottom: 4px; 
      }
      .checkmark-circle { 
        width: 100px; height: 100px; 
        background: #dcfce7; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin: 0 auto 20px; 
      }
      .checkmark { color: #16a34a; font-size: 50px; }

      /* --- A4 PRINT LAYOUT (FIXED GAP ISSUE) --- */
      @media print {
        @page { 
          size: A4; 
          margin: 10mm !important; /* Standardized narrow margin */
        }
        
        html, body { 
          background-color: white !important; 
          height: auto !important; /* Fixes the 1-page gap issue */
          min-height: initial !important;
          padding: 0 !important; 
          margin: 0 !important; 
          -webkit-print-color-adjust: exact; 
          font-size: 9pt; /* Slightly smaller for better fit */
        }
        
        /* Hide all non-report elements */
        #searchSection, #otpBtn, #printBtn, #termsCheckboxLabel, 
        #loader, .no-print, #instructionModal, #otpModal, button, 
        .animate-pulse, #supervisorInputSection, #termsCheckboxLabel {
          display: none !important;
        }
        
        /* Force container to collapse and use full width */
        #root, .container, .max-w-4xl { 
          box-shadow: none !important; 
          max-width: 100% !important; 
          width: 100% !important; 
          padding: 0 !important; 
          margin: 0 !important; 
          border: none !important;
          background-color: white !important;
          display: block !important; /* Prevents flex-center gaps */
          height: auto !important;
        }
        
        /* Remove decorative backgrounds for print clarity */
        .bg-gray-50, .bg-blue-50, .bg-red-50, .bg-white, .bg-emerald-50 { 
          background-color: white !important; 
          border: 1px solid #ddd !important; 
        }

        /* Compact Table Layout */
        table { 
          font-size: 9pt !important; 
          width: 100% !important; 
          border-collapse: collapse !important; 
          margin-top: 10px !important;
        }
        th, td { border: 1px solid #ccc !important; padding: 3px 6px !important; }
        th { background-color: #f1f1f1 !important; color: black !important; }

        /* Signature Area */
        #printSignatures { 
          display: flex !important; 
          visibility: visible !important;
          margin-top: 40px !important; 
          justify-content: space-between !important;
          page-break-inside: avoid;
        }

        /* Title Styling */
        #mainTitle { 
          text-align: center !important; 
          color: #006a4e !important; 
          font-size: 18pt !important; 
          margin-bottom: 5px !important; 
          border-bottom: 2px solid #006a4e !important; 
          padding-bottom: 5px !important;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 p-2 md:p-6">
    <div id="root"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
